[project]
name = "deadline-bot"
version = "0.1.0"
description = "Discord bot that reminds you of deadlines"
readme = "README.md"
authors = [
    { name = "Taha Hagar", email = "114830839+Taha-Hagar66@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
deadline-bot = "deadline_bot:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
